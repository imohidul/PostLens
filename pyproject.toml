[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postlens"
version = "1.0.4"
description = "Analyze Facebook page posts and comments with a local or free AI - anonymized, on your own PC."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "playwright>=1.44",
  "httpx>=0.27",
  "pydantic>=2.5",
  "keyring>=24",
  "trafilatura>=2.0",
  "fastembed>=0.7",
  "psutil>=5.9",
  "numpy>=1.26",
  "pywebview>=5.3; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
postlens = "postlens.__main__:main"

[tool.setuptools.packages.find]
include = ["postlens*"]

[tool.setuptools.package-data]
postlens = ["static/**/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
